name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm

      - run: npm ci

      # Would have caught the Astro 5 advisories — see ADR 0004.
      - run: npm audit --audit-level=high

      # Types plus content-collection schema validation. Audit §7.2 length
      # bounds and the category enum are enforced here, not by review.
      - run: npm run check

      - run: npm run build

      # CLAUDE.md hard rules, mechanically — scripts/lint-content.mjs.
      - run: npm run lint:content
